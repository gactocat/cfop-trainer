name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/verify-account-deletion.mts
      - run: node --import ./scripts/register-src-alias.mjs scripts/verify-account-storage.mts
      - run: node --import ./scripts/register-src-alias.mjs scripts/verify-practice-settings.mts
      - run: npm run build
      - run: npm run build:ios:web
